<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cont{background-color: rgb(12, 11, 18);height: 240px;width: 603px;text-align: center;position: relative;color:goldenrod}
        .div1{width: 200px;height: 190px;position: absolute;border: 1px solid;background-color:white;}
        .div2{width: 200px;height: 190px;margin-left: 200px;position: absolute;margin-top: 0px;border: 1px solid;background-color: aliceblue;}
        .div3{width: 200px;height: 190px;position: absolute;margin-left: 400px;border: 1px solid;background-color: aliceblue;}
       #sub{background-color: aqua;margin-top: 215px;position: absolute;left: 50%;transform: translateX(-50%);cursor: pointer;}
    </style>
</head>
<body>
    <!-- Added id to form and set action to web app URL -->
    <form id="inspectionForm" action="https://script.google.com/macros/s/AKfycbxHY1sdr-oliC2tURTe92L9oum1eqMno8Wea96gjplXk3klUnGPrgsRchvhP3fPNRVoLQ/exec" method="POST">
        <div class="cont"> Inspection Schedule
            <!-- Added name attributes to all inputs -->
            <div class="div1"><u> Block-D</u>
                <input name="d1"><br><br>
                <input name="d2"><br><br>
                <input name="d3"><br><br>
                <input name="d4">
            </div>
            <div class="div2"><u> Block-C</u>
                <input name="c1"><br><br>
                <input name="c2"><br><br>
                <input name="c3"><br><br>
                <input name="c4">
            </div>
            <div class="div3"><u>Others</u>
                <input name="o1"><br><br>
                <input name="o2"><br><br>
                <input name="o3"><br><br>
                <input name="o4">
            </div>
            <input type="submit" id="sub" value="Submit">
        </div>
    </form>

    <script>
        const form = document.getElementById('inspectionForm');
        form.addEventListener('submit', e => {
            e.preventDefault(); // Stop page refresh
            
            const submitBtn = document.getElementById('sub');
            submitBtn.value = "Sending...";
            submitBtn.disabled = true;

            fetch(form.action, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    alert('Data sent successfully to Google Sheets!');
                    form.reset(); // Clear the form
                    submitBtn.value = "Submit";
                    submitBtn.disabled = false;
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Something went wrong. Check console.');
                    submitBtn.value = "Submit";
                    submitBtn.disabled = false;
                });
        });
    </script>
</body>
</html>
